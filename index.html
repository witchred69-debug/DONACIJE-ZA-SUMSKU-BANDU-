<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šumska Banda traži pomoć za svoju mamu</title>
    <style>
        :root {
            --primary: #2ecc71;
            --primary-hover: #27ae60;
            --aircash: #e74c3c;
            --aircash-hover: #c0392b;
            --dark: #1a202c;
            --light: #f4f7f6;
            --text: #2d3748;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--light);
            /* Podloga sa suptilnim šapicama */
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='90' height='90' viewBox='0 0 90 90'%3E%3Cg fill='%232ecc71' fill-opacity='0.09'%3E%3Cpath d='M25 32c-3.5 0-6.5 3.5-6.5 7 0 2.5 2.5 4.5 6.5 4.5s6.5-2 6.5-4.5c0-3.5-3-7-6.5-7zm-8.5-5.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm6-4.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm6.5 0c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm5.5 4.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5z'/%3E%3Cpath d='M68 72c-3.5 0-6.5 3.5-6.5 7 0 2.5 2.5 4.5 6.5 4.5s6.5-2 6.5-4.5c0-3.5-3-7-6.5-7zm-8.5-5.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm6-4.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm6.5 0c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5zm5.5 4.5c-2 0-3.5 2-3.5 4.5s1.5 4 3.5 4 3.5-1.5 3.5-4-1.5-4.5-3.5-4.5z'/%3E%3C/g%3E%3C/svg%3E");
            color: var(--text);
            line-height: 1.7;
        }

        header {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), url('https://unsplash.com') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 80px 20px 100px 20px;
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto;
            opacity: 0.95;
        }

        .container {
            max-width: 1120px;
            margin: -50px auto 40px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 25px;
        }

        @media (max-width: 820px) {
            .container {
                grid-template-columns: 1fr;
                margin-top: -30px;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }

        .main-content, .sidebar {
            background: rgba(255, 255, 255, 0.97);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .main-content h2 {
            color: var(--dark);
            margin-bottom: 15px;
            border-bottom: 3px solid var(--primary);
            display: inline-block;
            padding-bottom: 4px;
            margin-top: 25px;
            font-size: 1.4rem;
        }

        .main-content h2:first-child {
            margin-top: 0;
        }

        .main-content p {
            margin-bottom: 16px;
            font-size: 1.05rem;
        }

        .highlight-box {
            background-color: #f0fff4;
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
            font-style: italic;
            color: #22543d;
        }

        .tiers-list {
            list-style: none;
            margin-top: 10px;
        }

        .tiers-list li {
            padding: 12px 15px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .tiers-list li strong {
            color: var(--aircash);
            font-size: 1.1rem;
        }

        .sidebar h3 {
            color: var(--dark);
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.4rem;
        }

        .start-badge {
            background: #ebf8ff;
            color: #2b6cb0;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 18px;
            border: 1px solid #bee3f8;
        }

        /* KARTICE ZA PLAĆANJE */
        .payment-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            background: #ffffff;
        }

        .payment-card h4 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donate-submit {
            width: 100%;
            background-color: var(--aircash);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            text-decoration: none;
            display: block;
            text-align: center;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.25);
        }

        .donate-submit:hover {
            background-color: var(--aircash-hover);
            transform: translateY(-2px);
        }

        .qr-center {
            text-align: center;
            margin-top: 14px;
        }

        .qr-center p {
            font-size: 0.85rem;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .qr-code {
            max-width: 165px;
            width: 100%;
            height: auto;
            border: 1px solid #e2e8f0;
            padding: 8px;
            border-radius: 10px;
            background: #fff;
        }

        /* BANKOVNI PODACI I KOPIRANJE */
        .bank-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .bank-info {
            font-size: 0.9rem;
            word-break: break-all;
        }

        .bank-info span {
            display: block;
            font-size: 0.78rem;
            color: #718096;
        }

        .copy-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .copy-btn:active {
            background: var(--primary);
        }

        .mandatory-note {
            font-size: 0.82rem;
            color: #c53030;
            background: #fff5f5;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #feb2b2;
            margin-top: 8px;
        }

        /* HUB3 BARKOD */
        .barcode-box {
            text-align: center;
            background: #fff;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .barcode-box img {
            max-width: 100%;
            height: auto;
        }

        /* SKRIVENI ADMIN PANEL */
        .login-box, .admin-panel {
            display: none;
            background: #edf2f7;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 2px solid #cbd5e0;
            text-align: left;
        }

        .login-box h4, .admin-panel h4 {
            margin-bottom: 12px;
            color: var(--dark);
        }

        .admin-panel label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 12px;
            color: #4a5568;
        }

        .admin-panel input, .admin-panel textarea, .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            background: white;
        }

        .admin-save-btn {
            background-color: var(--dark);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #718096;
            font-size: 0.9rem;
            user-select: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="view-title">ŠUMSKA BANDA TRAŽI POMOĆ ZA SVOJU MAMU</h1>
        <p id="view-subtitle">Ona je cijeli život nesebično spašavala napuštene šapice. Sada je ona u teškoj situaciji i treba našu pomoć.</p>
    </header>

    <div class="container">
        <main class="main-content">
            <h2>Naša priča: Vrijeme je da vratimo dobrotu</h2>
